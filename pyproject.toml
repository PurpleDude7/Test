[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "evalkit"
dynamic = ["version"]
description = "A small, pluggable library and CLI for evaluating LLM outputs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "evalkit contributors" }]
keywords = ["llm", "evaluation", "testing", "ci"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.7"]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
evalkit = "evalkit.cli:main"

[tool.hatch.version]
path = "src/evalkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/evalkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true
