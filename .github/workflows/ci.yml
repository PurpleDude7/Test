name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: pytest
        run: pytest
      - name: CLI smoke test (fake provider, doubles as the CI gate demo)
        run: evalkit run examples/suite.yaml --provider fake --report report.html --report report.json
      - name: LectureIQ smoke test (offline engine)
        run: lectureiq analyze @sample --markdown study-guide.md --json study-pack.json
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.11'
        with:
          name: evalkit-report
          path: |
            report.*
            study-guide.md
            study-pack.json
          if-no-files-found: ignore
